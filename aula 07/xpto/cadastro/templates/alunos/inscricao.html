{% extends 'base.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>matricula alunos</title>
</head>
<body>
    
<main>

<h1>{{msg}}</h1>
{% block content %}
    
    <table  cellpadding="10" cellspacing="0">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Curso</th>
                <th>Turma</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for aluno in alunos %}
            <tr>
                <td>{{ aluno.nome }}</td>
                <td>{{ aluno.curso }}</td>
                <td>{{ aluno.turma }}</td>
                <td><button>Editar</button><button>Excluir</button></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}





</main>


</body>
</html>
